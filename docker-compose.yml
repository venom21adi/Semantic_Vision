services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SEMANTIC_VISION_OPENAI_MODEL=${SEMANTIC_VISION_OPENAI_MODEL:-}
      - SEMANTIC_VISION_ANTHROPIC_MODEL=${SEMANTIC_VISION_ANTHROPIC_MODEL:-}
      - SEMANTIC_VISION_OLLAMA_MODEL=${SEMANTIC_VISION_OLLAMA_MODEL:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # Same value as the volume mount's source below -- lets the backend
      # recognize a real host path pasted into the app (instead of
      # /workspace/repo) and translate it itself. See
      # src/semantic_vision/api/host_path.py. Empty when REPO_PATH is
      # unset, matching the volume mount's own default of "."; the app's
      # own repo still needs /workspace/repo typed in that case.
      - SEMANTIC_VISION_HOST_REPO_PATH=${REPO_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The inspected repository, read-only -- source code should never be
      # writable from the container. `.visualiser/` needs its own mount
      # layered on top since persistence still needs somewhere to write;
      # see docs/progress/PROGRESS.md's Milestone 8 entry.
      - ${REPO_PATH:-.}:/workspace/repo:ro
      - ${REPO_PATH:-.}/.visualiser:/workspace/repo/.visualiser
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
