# Builds the bundled backend on every target platform and packages/publishes
# the VS Code extension (Milestone 19, Parts A and B -- see
# docs/PHASE-2-BUILD-PLAN.md).
#
# NOTE: `.github/` is git-ignored in this working copy (see .gitignore) --
# this file exists locally as the milestone's CI deliverable but won't be
# committed/pushed by a normal `git add` here. To actually run this in
# GitHub Actions, the maintainer needs to add it with `git add -f` (or from
# a checkout where `.github/` isn't ignored) when they're ready to wire up
# real publishing.
#
# Version-sync policy (candidate scope item 4): this workflow always builds
# the backend binary fresh from `pyproject.toml` at the commit being
# released -- never from a cached or previously-built artifact -- so an
# extension release can't silently ship a stale backend. The exact
# `pyproject.toml` version that went into a given binary is stamped
# alongside it as `bin/BACKEND_VERSION`, so it's inspectable after install.
name: Publish VS Code Extension

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch: {}

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            binary_name: semantic-vision-backend.exe
          - os: ubuntu-latest
            target: linux-x64
            binary_name: semantic-vision-backend
          - os: macos-latest
            target: darwin-x64
            binary_name: semantic-vision-backend
          - os: macos-latest
            target: darwin-arm64
            binary_name: semantic-vision-backend
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies
        run: uv sync

      - name: Build frozen backend binary
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm \
            --distpath dist/pyinstaller --workpath build/pyinstaller \
            scripts/pyinstaller/backend.spec

      - name: Stamp bundled backend version
        shell: bash
        run: |
          uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" \
            > dist/pyinstaller/BACKEND_VERSION

      - name: Smoke-test the frozen binary
        shell: bash
        run: |
          ./dist/pyinstaller/${{ matrix.binary_name }} --port 8123 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/api/health

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: |
            dist/pyinstaller/${{ matrix.binary_name }}
            dist/pyinstaller/BACKEND_VERSION

  package:
    needs: build-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Install extension deps
        run: npm ci --prefix vscode-extension

      - uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: vscode-extension/bin

      - run: chmod +x vscode-extension/bin/semantic-vision-backend* || true

      - name: Compile extension
        run: npm run compile --prefix vscode-extension

      - name: Package
        working-directory: vscode-extension
        run: npx vsce package --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-extension/*.vsix

  # A separate, single job rather than a `publish` step inside each
  # `package` matrix leg: `vsce publish` for multiple platform targets of
  # the *same* version has to happen as one call (it accepts several
  # `--packagePath` values at once, specifically for this multi-target
  # case) -- four parallel `vsce publish` calls, one per target, raced
  # against the Marketplace API's "does this version already exist yet"
  # check and every one of them lost, each seeing "The extension already
  # exists" with nothing actually landing. Publishing once, after every
  # platform's .vsix is built, avoids the race entirely.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      # Requires a `VSCE_PAT` repo secret -- a Personal Access Token scoped
      # to Marketplace (Manage), from the publisher account created per
      # Part B step 1 (docs/PHASE-2-BUILD-PLAN.md). Not created by this
      # workflow; a human, one-time setup step. `npx --yes` fetches
      # `@vscode/vsce` fresh -- this job has no checkout/npm-install step of
      # its own, since all it needs is the already-built .vsix files.
      - name: Publish all platform packages together
        run: npx --yes @vscode/vsce publish -p ${{ secrets.VSCE_PAT }} --packagePath vsix/*.vsix
